<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="main-container">
        <nav class="navbar">
            <a href="/ejercicio 5/index.html">Inicio</a>
            <a href="/ejercicio 5/experiencia.html">Experiencia</a>
            <a href="/ejercicio 5/estudios.html">Estudios</a>
            <a href="/ejercicio 5/hobbies.html">Hobbies</a>
            <a href="/ejercicio 5/contacto.html">Contacto</a>
        </nav>

        <div class="seccion-info">
            <div class="texto-perfil">
                <h1 class="titulo-seleccionado">Contacto</h1>
                <form action="#" method="POST" class="formulario">
                    <div class="campo">
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" required minlength="3">
                    </div>

                    <div class="campo">
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="campo">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="5" required minlength="10"></textarea>
                    </div>

                    <button type="submit" class="btn-enviar">Enviar Mensaje</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
